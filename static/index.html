<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Last-Mile Emergency Dispatch</title>

  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #10141c;
      --panel: #171d28;
      --border: #2c3545;
      --text: #f5f7fb;
      --muted: #9da7b5;
      --green: #7ee787;
      --blue: #79c0ff;
      --amber: #ffcc66;
      --red: #ff7b72;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 16px 30px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    h1, h2, h3, p { margin-top: 0; }
    header h1 { margin: 0; font-size: 22px; }

    h2 {
      font-size: 16px;
      margin-bottom: 12px;
      color: #c9d1d9;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .section-head h2 { margin-bottom: 0; }

    select {
      background: #263244;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 13px;
      font-weight: bold;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .clock { color: var(--green); font-weight: bold; }

    .conn {
      font-size: 12px;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 999px;
      background: #1f3a2a;
      color: var(--green);
    }

    .conn.offline { background: #3d1f1f; color: var(--red); }

    main {
      padding: 24px 30px;
      max-width: 1400px;
      margin: auto;
    }

    .metrics, .grid { display: grid; gap: 16px; }

    .metrics {
      grid-template-columns: repeat(4, 1fr);
      margin-bottom: 24px;
    }

    .grid { grid-template-columns: repeat(2, 1fr); }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      min-width: 0;
    }

    .full-width { grid-column: 1 / -1; }

    .metric-value {
      font-size: 30px;
      font-weight: bold;
      color: var(--blue);
      font-variant-numeric: tabular-nums;
    }

    .metric-value.delivered { color: var(--green); }
    .metric-value.risk { color: var(--amber); }
    .metric-value.wasted { color: var(--red); }

    .metric-label { color: var(--muted); font-size: 13px; }

    .item {
      border-top: 1px solid var(--border);
      padding: 12px 0;
    }

    .item:first-child { border-top: 0; padding-top: 0; }

    .item-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .sub { color: var(--muted); font-size: 14px; }

    .status {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 0.03em;
      background: #263244;
      white-space: nowrap;
    }

    .status.open    { color: var(--green); background: rgba(126, 231, 135, 0.12); }
    .status.warning { color: var(--amber); background: rgba(255, 204, 102, 0.12); }
    .status.danger  { color: var(--red);   background: rgba(255, 123, 114, 0.12); }
    .status.info    { color: var(--blue);  background: rgba(121, 192, 255, 0.12); }

    .actions { margin-top: 8px; }

    button {
      border: 0;
      border-radius: 7px;
      padding: 8px 12px;
      margin: 4px 4px 0 0;
      cursor: pointer;
      background: #238636;
      color: white;
      font-weight: bold;
      font-size: 13px;
      transition: filter 0.15s, opacity 0.15s;
    }

    button:hover:not(:disabled) { filter: brightness(1.15); }
    button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    button.secondary { background: #30363d; }
    button.danger-button { background: #da3633; }

    .controls { margin-bottom: 24px; }

    #events {
      max-height: 260px;
      overflow-y: auto;
    }

    .empty { color: #8b949e; font-style: italic; }

    /* Toasts */
    #toasts {
      position: fixed;
      right: 20px;
      bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 100;
      max-width: min(360px, calc(100vw - 40px));
    }

    .toast {
      padding: 12px 14px;
      border-radius: 8px;
      background: #1f2937;
      border-left: 4px solid var(--green);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      font-size: 14px;
      animation: slide-in 0.2s ease-out;
    }

    .toast.error { border-left-color: var(--red); }

    @keyframes slide-in {
      from { transform: translateY(10px); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }

    @media (max-width: 900px) {
      .metrics { grid-template-columns: repeat(2, 1fr); }
      .grid { grid-template-columns: 1fr; }
      header { align-items: flex-start; flex-direction: column; }
      main, header { padding-left: 16px; padding-right: 16px; }
    }

    @media (max-width: 480px) {
      .metrics { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <header>
    <h1>Last-Mile Emergency Dispatch</h1>
    <div class="header-right">
      <div class="clock">Simulation clock: <span id="clock">0.0</span> min</div>
      <span id="conn" class="conn">● Live</span>
    </div>
  </header>

  <main>
    <section class="metrics">
      <div class="card">
        <div class="metric-value delivered" id="delivered">0</div>
        <div class="metric-label">Delivered (Portions / Items)</div>
      </div>
      <div class="card">
        <div class="metric-value" id="transit">0</div>
        <div class="metric-label">In Transit (Portions / Items)</div>
      </div>
      <div class="card">
        <div class="metric-value risk" id="risk">0</div>
        <div class="metric-label">At Risk</div>
      </div>
      <div class="card">
        <div class="metric-value wasted" id="wasted">0</div>
        <div class="metric-label">Expired / Wasted</div>
      </div>
    </section>

    <section class="card controls">
      <h2>Simulation Controls</h2>
      <button data-action="advance" data-minutes="1">+1 min</button>
      <button data-action="advance" data-minutes="5">+5 min</button>
      <button data-action="advance" data-minutes="10">+10 min</button>
      <button class="secondary" data-action="reset">Reset Demo</button>
    </section>

    <section class="grid">
      <div class="card">
        <h2>Shelters</h2>
        <div id="shelters"><div class="empty">Loading…</div></div>
      </div>

      <div class="card">
        <h2>Batches</h2>
        <div id="batches"><div class="empty">Loading…</div></div>
      </div>

      <div class="card">
        <h2>Riders</h2>
        <div id="riders"><div class="empty">Loading…</div></div>
      </div>

      <div class="card">
        <div class="section-head">
          <h2>Claimable Cards</h2>
          <select id="rider-select" aria-label="Select Rider">
            <option value="rider-1">Rider 1 (R1)</option>
          </select>
        </div>
        <div id="cards"><div class="empty">Loading…</div></div>
      </div>

      <div class="card full-width">
        <h2>Event Log</h2>
        <div id="events"><div class="empty">Loading…</div></div>
      </div>
    </section>
  </main>

  <div id="toasts"></div>

  <script>
    let selectedRiderId = "rider-1";
    const POLL_MS = 2000;

    const BATCH_CONSUMED = new Set(["CLAIMED", "IN_TRANSIT", "DELIVERED", "EXPIRED", "WASTED"]);
    const NEED_COUNTED = new Set(["CLAIMED", "IN_TRANSIT", "DELIVERED"]);

    let lastStateKey = "";
    let lastCardsKey = "";
    let loading = false;
    let reloadQueued = false;

    // ---------- helpers ----------

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function num(value, digits = 1) {
      const n = Number(value);
      return Number.isFinite(n) ? n.toFixed(digits) : "—";
    }

    function toast(message, type = "ok") {
      if (!message) return;
      const el = document.createElement("div");
      el.className = `toast ${type === "error" ? "error" : ""}`;
      el.textContent = message;
      document.getElementById("toasts").appendChild(el);
      setTimeout(() => el.remove(), 3500);
    }

    function setConnection(online, reason = "") {
      const el = document.getElementById("conn");
      el.textContent = online ? "● Live" : "● Offline";
      el.className = `conn ${online ? "" : "offline"}`;
      el.title = reason;
    }

    async function api(url, options = {}) {
      const response = await fetch(url, {
        ...options,
        headers: {
          "Content-Type": "application/json",
          ...(options.headers || {})
        }
      });

      let data = {};
      try { data = await response.json(); } catch { /* non-JSON body */ }

      if (!response.ok) {
        const msg =
          (typeof data.message === "string" && data.message) ||
          (typeof data.detail === "string" && data.detail) ||
          `Request failed (HTTP ${response.status})`;
        throw new Error(msg);
      }

      return data;
    }

    function post(url, body) {
      return api(url, {
        method: "POST",
        body: body ? JSON.stringify(body) : undefined
      });
    }

    // ---------- data loading ----------

    async function loadState(force = false) {
      if (loading) {
        reloadQueued = true;
        return;
      }
      loading = true;

      try {
        const [stateRes, cardsRes] = await Promise.allSettled([
          api("/state"),
          api(`/riders/${encodeURIComponent(selectedRiderId)}/cards`)
        ]);

        if (stateRes.status === "rejected") throw stateRes.reason;
        setConnection(true);

        const state = stateRes.value;
        const stateKey = JSON.stringify(state) + "|" + selectedRiderId;
        if (force || stateKey !== lastStateKey) {
          lastStateKey = stateKey;
          render(state);
        }

        if (cardsRes.status === "fulfilled") {
          const cards = cardsRes.value.cards || [];
          const cardsKey = JSON.stringify(cards) + "|" + selectedRiderId;
          if (force || cardsKey !== lastCardsKey) {
            lastCardsKey = cardsKey;
            renderCards(cards);
          }
        }
      } catch (err) {
        setConnection(false, err.message);
      } finally {
        loading = false;
        if (reloadQueued) {
          reloadQueued = false;
          loadState(true);
        }
      }
    }

    // ---------- rendering ----------

    function render(state) {
      const clock = Number(state.clock_minutes) || 0;
      const portions = state.portions || [];
      const shelters = state.shelters || [];
      const needs = state.needs || [];
      const batches = state.batches || [];
      const riders = state.riders || [];
      const events = state.events || [];

      const shelterMap = Object.fromEntries(shelters.map(s => [s.id, s]));

      document.getElementById("clock").textContent = num(clock);

      // Sync rider selector options
      const riderSelect = document.getElementById("rider-select");
      if (riders.length) {
        if (!riders.some(r => r.id === selectedRiderId)) {
          selectedRiderId = riders[0].id;
        }
        riderSelect.innerHTML = riders.map(r => `
          <option value="${esc(r.id)}" ${r.id === selectedRiderId ? "selected" : ""}>
            ${esc(r.name)} (${esc(r.id)})
          </option>
        `).join("");
      }

      // Metrics (Portions & Item Quantities)
      const statSummary = pred => {
        const list = portions.filter(pred);
        const qty = list.reduce((sum, p) => sum + (Number(p.qty) || 0), 0);
        return `${list.length} (${qty})`;
      };

      document.getElementById("delivered").textContent =
        statSummary(p => p.status === "DELIVERED");
      document.getElementById("transit").textContent =
        statSummary(p => p.status === "IN_TRANSIT");
      document.getElementById("risk").textContent =
        statSummary(p => p.at_risk === true && ["CLAIMED", "IN_TRANSIT"].includes(p.status));
      document.getElementById("wasted").textContent =
        statSummary(p => ["EXPIRED", "WASTED"].includes(p.status));

      // Shelters
      document.getElementById("shelters").innerHTML = shelters.length
        ? shelters.map(shelter => {
            const isOpen = shelter.status === "OPEN";
            const shelterNeeds = needs.filter(n => n.shelter_id === shelter.id);

            return `
              <div class="item">
                <div class="item-head">
                  <strong>${esc(shelter.name)}</strong>
                  <span class="status ${isOpen ? "open" : "warning"}">${esc(shelter.status)}</span>
                </div>
                <div class="sub">
                  Water: ${shelter.has_water ? "Yes" : "No"} ·
                  Fuel: ${shelter.has_fuel ? "Yes" : "No"}
                </div>
                <div>
                  ${shelterNeeds.length
                    ? shelterNeeds.map(n => {
                        const used = portions
                          .filter(p => p.need_id === n.id && NEED_COUNTED.has(p.status))
                          .reduce((s, p) => s + p.qty, 0);
                        const rem = Math.max(0, n.qty - used);
                        return `${esc(n.item_type)}: <strong>${rem}</strong> / ${esc(n.qty)} needed (by ${num(n.need_by)}m)`;
                      }).join("<br>")
                    : `<span class="empty">No open needs</span>`}
                </div>
                <div class="actions">
                  ${isOpen ? `
                    <button class="danger-button"
                      data-action="unavailable"
                      data-shelter-id="${esc(shelter.id)}">
                      Temporarily Unavailable
                    </button>
                  ` : `
                    <button
                      data-action="reopen"
                      data-shelter-id="${esc(shelter.id)}">
                      Reopen Shelter
                    </button>
                  `}
                  <button class="secondary"
                    data-action="toggleUtility"
                    data-shelter-id="${esc(shelter.id)}"
                    data-field="has_water"
                    data-val="${!shelter.has_water}">
                    ${shelter.has_water ? "Cut Water" : "Restore Water"}
                  </button>
                  <button class="secondary"
                    data-action="toggleUtility"
                    data-shelter-id="${esc(shelter.id)}"
                    data-field="has_fuel"
                    data-val="${!shelter.has_fuel}">
                    ${shelter.has_fuel ? "Cut Fuel" : "Restore Fuel"}
                  </button>
                </div>
              </div>
            `;
          }).join("")
        : `<div class="empty">No shelters</div>`;

      // Batches
      document.getElementById("batches").innerHTML = batches.length
        ? batches.map(batch => {
            const remainingTime = Number(batch.safe_until) - clock;
            let cls = "open", label = `${num(remainingTime)} min left`;
            if (!Number.isFinite(remainingTime)) { cls = "info"; label = "—"; }
            else if (remainingTime <= 0) { cls = "danger"; label = "EXPIRED"; }
            else if (remainingTime <= 10) { cls = "warning"; }

            const usedQty = portions
              .filter(p => p.batch_id === batch.id && BATCH_CONSUMED.has(p.status))
              .reduce((s, p) => s + p.qty, 0);
            const remainingQty = remainingTime <= 0 ? 0 : Math.max(0, batch.total_qty - usedQty);

            return `
              <div class="item">
                <div class="item-head">
                  <strong>${esc(batch.item_type)}</strong>
                  <span class="status ${cls}">${label}</span>
                </div>
                <div class="sub">Remaining qty: <strong>${remainingQty}</strong> / ${esc(batch.total_qty)}</div>
                <div class="sub">Safe until: ${num(batch.safe_until)} min</div>
              </div>
            `;
          }).join("")
        : `<div class="empty">No batches</div>`;

      // Riders
      document.getElementById("riders").innerHTML = riders.length
        ? riders.map(rider => {
            const portion = portions.find(
              p => p.rider_id === rider.id && ["CLAIMED", "IN_TRANSIT"].includes(p.status)
            );
            const targetShelter = portion ? shelterMap[portion.shelter_id] : null;

            let badgeClass = "open", badgeText = "ACTIVE";
            if (rider.unresponsive) { badgeClass = "danger"; badgeText = "UNRESPONSIVE"; }
            else if (rider.frozen) { badgeClass = "warning"; badgeText = "FROZEN"; }

            return `
              <div class="item">
                <div class="item-head">
                  <strong>${esc(rider.name)}</strong>
                  <span class="status ${badgeClass}">${badgeText}</span>
                </div>
                <div class="sub">Location: (${num(rider.x)}, ${num(rider.y)})</div>
                <div class="sub">
                  Delivery:
                  ${portion
                    ? `<span class="status info">${esc(portion.status)}</span>
                       ${portion.at_risk ? `<span class="status danger">AT RISK</span>` : ""}
                       — ${esc(portion.qty)} to <strong>${esc(targetShelter?.name || portion.shelter_id)}</strong>
                       (msgs: ${esc(portion.traffic_msgs)}/3, lease: ${num(portion.claim_expires_at)}m)`
                    : "None"}
                </div>
                <div class="actions">
                  <button class="secondary"
                    data-action="freeze"
                    data-rider-id="${esc(rider.id)}"
                    data-frozen="${!rider.frozen}">
                    ${rider.frozen ? "Unfreeze" : "Freeze"}
                  </button>
                  ${portion ? `
                    <button class="danger-button"
                      data-action="cancel"
                      data-portion-id="${esc(portion.id)}"
                      ${portion.status === "IN_TRANSIT" ? 'title="Cannot cancel after pickup"' : ""}>
                      Cancel
                    </button>
                    <button
                      data-action="message"
                      data-portion-id="${esc(portion.id)}">
                      Traffic Message (${esc(portion.traffic_msgs)}/3)
                    </button>
                  ` : ""}
                </div>
              </div>
            `;
          }).join("")
        : `<div class="empty">No riders</div>`;

      // Events (preserve scroll position)
      const eventsEl = document.getElementById("events");
      const scroll = eventsEl.scrollTop;
      eventsEl.innerHTML = events.length
        ? [...events].reverse().map(event => `
            <div class="item">
              <strong>${num(event.time)} min</strong> — ${esc(event.text)}
            </div>
          `).join("")
        : `<div class="empty">No events yet</div>`;
      eventsEl.scrollTop = scroll;
    }

    function renderCards(cards) {
      const container = document.getElementById("cards");

      if (!cards.length) {
        container.innerHTML = `<div class="empty">No claimable cards for ${esc(selectedRiderId)}</div>`;
        return;
      }

      container.innerHTML = cards.map(card => `
        <div class="item">
          <div class="item-head">
            <strong>${esc(card.shelter_name)}</strong>
            <span class="status info">${esc(card.item_type)}</span>
          </div>
          <div class="sub">Available: ${esc(card.available_qty)}</div>
          <div class="actions">
            <button
              data-action="claim"
              data-need-id="${esc(card.need_id)}"
              data-batch-id="${esc(card.batch_id)}">
              Claim as ${esc(selectedRiderId)}
            </button>
          </div>
        </div>
      `).join("");
    }

    // ---------- actions ----------

    const actions = {
      async advance(btn) {
        await post("/sim/advance", { minutes: Number(btn.dataset.minutes) });
        return null;
      },

      async reset() {
        await post("/seed");
        return { message: "Demo reset" };
      },

      claim(btn) {
        return post("/claim", {
          rider_id: selectedRiderId,
          need_id: btn.dataset.needId,
          batch_id: btn.dataset.batchId
        });
      },

      async freeze(btn) {
        await post("/sim/freeze_rider", {
          rider_id: btn.dataset.riderId,
          frozen: btn.dataset.frozen === "true"
        });
        return null;
      },

      cancel(btn) {
        return post(`/portions/${encodeURIComponent(btn.dataset.portionId)}/cancel`);
      },

      message(btn) {
        return post(`/portions/${encodeURIComponent(btn.dataset.portionId)}/message`);
      },

      async unavailable(btn) {
        const result = await post("/sim/shelter_unavailable", {
          shelter_id: btn.dataset.shelterId
        });
        return {
          message:
            `Rerouted: ${(result.rerouted || []).length}, ` +
            `Cancelled: ${(result.cancelled || []).length}, ` +
            `At risk: ${(result.at_risk || []).length}`
        };
      },

      async reopen(btn) {
        await post("/sim/shelter_open", {
          shelter_id: btn.dataset.shelterId
        });
        return { message: "Shelter reopened" };
      },

      async toggleUtility(btn) {
        const body = {
          shelter_id: btn.dataset.shelterId,
          [btn.dataset.field]: btn.dataset.val === "true"
        };
        const result = await post("/sim/shelter_status", body);
        return {
          message:
            `Updated utility — Rerouted: ${(result.rerouted || []).length}, ` +
            `At risk: ${(result.at_risk || []).length}`
        };
      }
    };

    document.getElementById("rider-select").addEventListener("change", (e) => {
      selectedRiderId = e.target.value;
      loadState(true);
    });

    document.addEventListener("click", async (e) => {
      const btn = e.target.closest("button[data-action]");
      if (!btn || btn.disabled) return;

      const fn = actions[btn.dataset.action];
      if (!fn) return;

      btn.disabled = true;
      try {
        const result = await fn(btn);
        if (result && result.message) {
          const failed = result.ok === false || result.success === false;
          toast(result.message, failed ? "error" : "ok");
        }
      } catch (err) {
        toast(err.message || "Something went wrong", "error");
      } finally {
        btn.disabled = false;
        await loadState(true);
      }
    });

    // ---------- polling ----------

    async function pollLoop() {
      if (!document.hidden) await loadState();
      setTimeout(pollLoop, POLL_MS);
    }

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) loadState(true);
    });

    pollLoop();
  </script>
</body>
</html>
